name: VYRA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VYRA-Android-4.2.3-Full-Audit-Fix.zip
      - .github/workflows/vyra-android-build.yml

permissions:
  contents: read

concurrency:
  group: vyra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VYRA debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          # This input is split on spaces by setup-android. Keep it single-line.
          packages: platform-tools

      - name: Accept licenses and install Android 35 packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          install_sdk_package() {
            local package="$1"
            local attempt
            for attempt in 1 2 3; do
              echo "Installing ${package} (attempt ${attempt}/3)"
              if sdkmanager --install "$package"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            echo "ERROR: Could not install SDK package: ${package}" >&2
            return 1
          }

          install_sdk_package 'platforms;android-35'
          install_sdk_package 'build-tools;35.0.0'

      - name: Verify and extract VYRA source
        shell: bash
        run: |
          set -euo pipefail
          ZIP='VYRA-Android-4.2.3-Full-Audit-Fix.zip'
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root." >&2
            exit 1
          fi

          unzip -tq "$ZIP"
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/source"

          PROJECT_DIR="$GITHUB_WORKSPACE/source/VYRA"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build debug APK
        id: apk_build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace --console=plain \
            assembleDebug 2>&1 | tee "$RUNNER_TEMP/vyra-assemble.log"
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        id: unit_tests
        if: ${{ steps.apk_build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace --console=plain \
            testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/vyra-tests.log"

      - name: Upload VYRA debug APK
        if: ${{ steps.apk_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: VYRA-Android-APK
          path: source/VYRA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VYRA-Build-Logs
          path: |
            ${{ runner.temp }}/vyra-assemble.log
            ${{ runner.temp }}/vyra-tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail job if unit tests failed
        if: ${{ steps.unit_tests.outcome == 'failure' }}
        shell: bash
        run: |
          echo 'APK was assembled and uploaded, but unit tests failed.' >&2
          exit 1

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo '## VYRA Build Results' >> "$GITHUB_STEP_SUMMARY"
          echo '- APK assembly: ${{ steps.apk_build.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unit tests: ${{ steps.unit_tests.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- An APK is uploaded only after successful assembly.' >> "$GITHUB_STEP_SUMMARY"
